# Model Registry Configuration
# Defines available models, providers, and aliases

providers:
  anthropic:
    env_var: ANTHROPIC_API_KEY
  openai:
    env_var: OPENAI_API_KEY
  bedrock:
    api_base: https://bedrock-runtime.us-east-1.amazonaws.com

models:
  claude-3-opus:
    provider: anthropic
    model_id: claude-3-opus-20240229
    display_name: Claude 3 Opus
    context_window: 200000
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    supports_tools: true
    supports_vision: true

  claude-3-sonnet:
    provider: anthropic
    model_id: claude-3-sonnet-20240229
    display_name: Claude 3 Sonnet
    context_window: 200000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    supports_tools: true
    supports_vision: true

  claude-3-haiku:
    provider: anthropic
    model_id: claude-3-haiku-20240307
    display_name: Claude 3 Haiku
    context_window: 200000
    cost_per_1k_input: 0.00025
    cost_per_1k_output: 0.00125
    supports_tools: true
    supports_vision: true

  gpt-4-turbo:
    provider: openai
    model_id: gpt-4-turbo-preview
    display_name: GPT-4 Turbo
    context_window: 128000
    cost_per_1k_input: 0.01
    cost_per_1k_output: 0.03
    supports_tools: true
    supports_vision: true

  gpt-3.5-turbo:
    provider: openai
    model_id: gpt-3.5-turbo
    display_name: GPT-3.5 Turbo
    context_window: 16385
    cost_per_1k_input: 0.0005
    cost_per_1k_output: 0.0015
    supports_tools: true
    supports_vision: false

# Aliases decouple code from specific models
# Change these to swap models without code changes
aliases:
  primary: claude-3-opus      # Best quality, use for complex tasks
  fast: claude-3-haiku        # Low latency, use for simple tasks
  cheap: gpt-3.5-turbo        # Lowest cost, use for bulk operations
  balanced: claude-3-sonnet   # Good balance of quality/cost
